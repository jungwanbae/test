# ─────────────────────────────────────────────────────────────────────────────
# 미국 레그 — NH 나무 PLUG 해외주식 API, 달러 계좌. 기본 = QUAD(1순위, 4등분)
#   QUAD 전체 배분: 국내 30%(MSAP-M 25 + 고금리 대비형 코스피 5, config/default.yaml)
#                   미국 70% = 확인형 역발상 VT 25 + 레버리지 RP 25 + 고금리 대비형 미국 부분 20 (이 파일)
#   TRIAD 표준으로 쓰려면: triad_us.hr_weight 0, default.yaml 의 msap.hr_kospi.weight 0, autotrader triad --kr-share 0.333
#   레그 간 배분 점검:  autotrader triad   (환전은 수동, ±10%p 벗어날 때)
# 시간은 모두 미국 동부시간(ET). 신호 = 전일 미국 종가, 매매 = 다음 거래일 장중.
# 주의: 미국 레버리지 ETF(TQQQ·TMF·UGL) 매매에는 금융당국 요건(해외 레버리지 ETP 사전교육·기본예탁금 등)이
#       있을 수 있습니다. NH 계좌에서 먼저 확인하세요.
#       '고금리 대비형'을 다른 곳(기존 알림)에서 따로 운용 중이면 같은 돈으로 이중 운용하지 않도록 둘 중 하나만 쓰세요.
# ─────────────────────────────────────────────────────────────────────────────
market: US

broker:
  name: nh_plug            # nh_plug(NH 해외주식 모의/실전) | paper(실시세로 받고 체결은 로컬에서 가상 처리)
  env: mock                # 모의투자에서 충분히 검증 후 live
  nh_brand: namuh
  nh_rate_limit_per_sec: 4
  # name: paper 일 때 쓰는 값 — 국내 레그와 상태 파일이 겹치지 않게 분리, 초기 자금은 달러
  paper_initial_cash: 50000
  paper_state_file: state/paper_us.json
  paper_quote_source: nh_plug

universe:
  risk_assets:
    - {symbol: QQQ,  name: "Invesco QQQ (나스닥100)",         asset_class: 미국주식, kind: us}
    - {symbol: TQQQ, name: "ProShares UltraPro QQQ (3배)",    asset_class: 미국주식, kind: us}
    - {symbol: TLT,  name: "iShares 20+Y 국채",               asset_class: 미국장기채, kind: us}
    - {symbol: TMF,  name: "Direxion 20+Y 국채 3배",          asset_class: 미국장기채, kind: us}
    - {symbol: GLD,  name: "SPDR Gold",                       asset_class: 금, kind: us}
    - {symbol: UGL,  name: "ProShares Ultra Gold (2배)",      asset_class: 금, kind: us}
    - {symbol: DBC,  name: "Invesco DB 원자재",               asset_class: 원자재, kind: us}
  cash_asset: {symbol: SGOV, name: "iShares 0-3개월 미국채", asset_class: 현금성, kind: us}

strategy:
  name: triad_us

triad_us:
  hr_weight: 0.2857        # 미국 레그 안 고금리 대비형 미국 부분(나스닥 GC·VT + 금) = 전체의 20%. 0 이면 TRIAD
  vt_weight: 0.5           # 나머지를 확인형 역발상 VT 50% + 레버리지 RP 50% (= 전체의 25%씩)
  vt_target: 0.25
  crash: -0.30             # 최근 2년 안에 사상 최고가 대비 −30% 이하였던 적이 있고 …
  boost_leverage: 3.0      # … 후 골든크로스 확인 시 1년간 3배(골든크로스 깨지면 해제)
  boost_days: 252
  lrp_target: 0.18
  cash_rate: 0.040         # 미국 단기금리(연). 연준 금리가 바뀌면 갱신(추세 필터 기준)

rebalance:
  drift_threshold: 0.10
  no_trade_band: 0.01
  min_order_value: 100     # 달러
  history_years: 6         # 낙폭 판정(2년)·200일선·12개월 추세용. 사상 최고가는 이 조회 기간 안에서 계산된다

execution:
  run_time: "10:30"        # ET. 개장 직후 변동이 가라앉은 뒤
  deadline: "15:30"        # ET
  limit_offset_ticks: 2    # 매수=매도호가+2센트, 매도=매수호가−2센트
  fill_timeout_sec: 60
  poll_interval_sec: 5
  max_rounds: 4
  final_market_order: true

risk:
  capital_limit: null      # 달러. 예: 50000 → 미국 레그에 5만 달러까지만
  cash_buffer_pct: 0.01
  max_order_value: 100000  # 달러
  max_turnover_pct: 2.5
  max_price_deviation: 0.35   # 3배 ETF 는 하루 ±30%도 가능 → 이상치 기준을 넓게
  kill_switch_file: STOP
  require_live_confirm: true

costs:
  preset: nh_plug_us
  slippage_bps: 3

storage:
  db_path: state/triad_us.db
  cache_dir: data/cache_us
  log_dir: logs

notify:
  telegram: false

extra_holidays: []
