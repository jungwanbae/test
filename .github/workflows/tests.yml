name: tests
on: [push, pull_request]
jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev,report]"
      # ML 테스트는 torch 가 없으면 자동 skip (CI 시간 절약)
      - run: pytest -q
